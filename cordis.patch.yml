# Optional config for the Host half only:
#   libraryDir: /absolute/path/to/the/folder/chosen/as/书库目录
# lets every reading_* tool read that folder's library.json without being told the
# path on each call. There is no database and no dbPath any more — the folder is
# the store, and the client mirrors into it on every save.
- insert:
    - id: shiguang-reader
      name: '@local/shiguang-reader'

# Optional: set index: false to disable the host-side SQLite cache entirely.
# The folder snapshot remains the source of truth in either mode.
#   index: false
