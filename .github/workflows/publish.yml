name: Publish npm package

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Build and verify committed client
        run: |
          node build.mjs
          git diff --exit-code -- client.js
          npm test

      - name: Check npm token
        id: npm-token
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=NPM_TOKEN missing::Add an npm granular token with publish + bypass 2FA as NPM_TOKEN."
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish only a new version
        if: steps.npm-token.outputs.publish == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          if npm view "$NAME@$VERSION" version --registry=https://registry.npmjs.org >/dev/null 2>&1; then
            echo "$NAME@$VERSION is already published; skipping."
            exit 0
          fi
          npm publish --access public --registry=https://registry.npmjs.org
